<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IPScout - Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
        #title {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: #111; color: #0f0; font-family: monospace;
            padding: 8px 16px; border-radius: 6px; border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="title">🌍 IPScout - Interactive Map</div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([28.0907, 30.7566], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        L.marker([28.0907, 30.7566]).addTo(map).bindPopup('197.59.60.45<br>Minya, Egypt<br>ISP: TE Data');

    </script>
</body>
</html>
